services:
  postgres:
    image: pgvector/pgvector:pg17
    container_name: market-intel-postgres
    environment:
      POSTGRES_USER: marketintel
      POSTGRES_PASSWORD: marketintel
      POSTGRES_DB: marketintel
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U marketintel -d marketintel"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
